name: Diagnose Typecheck
on:
  pull_request:
    branches: [main]
permissions:
  issues: write
  statuses: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - id: tc
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/github-script@v7
        env:
          TC_OUTPUT: ${{ steps.tc.outputs.exit }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/typecheck.txt','utf8').trim();
            const body = `Temporary typecheck diagnostics (exit ${process.env.TC_OUTPUT}):\n\n\`\`\`text\n${output.slice(0, 6000)}\n\`\`\``;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
      - run: test "${{ steps.tc.outputs.exit }}" = "0"
