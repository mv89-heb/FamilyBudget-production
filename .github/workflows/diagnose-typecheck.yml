name: Diagnose Typecheck
on:
  pull_request:
    branches: [main]
permissions:
  statuses: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - id: tc
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/github-script@v7
        env:
          TC_OUTPUT: ${{ steps.tc.outputs.exit }}
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/typecheck.txt','utf8').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            const state = process.env.TC_OUTPUT === '0' ? 'success' : 'failure';
            for (let i = 0; i < Math.min(8, lines.length); i++) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state,
                context: `typecheck-diagnostic-${i + 1}`,
                description: lines[i].slice(0, 140),
                target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
              });
            }
      - run: test "${{ steps.tc.outputs.exit }}" = "0"
