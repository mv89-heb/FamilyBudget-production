name: Diagnose Typecheck
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - id: tc
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck-diagnostic.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> /tmp/typecheck-diagnostic.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic output
        uses: actions/github-script@v7
        env:
          TC_OUTPUT: ${{ steps.tc.outputs.exit }}
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('/tmp/typecheck-diagnostic.txt');
            const path = '.github/typecheck-diagnostic.txt';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: context.payload.pull_request.head.ref });
              sha = existing.data.sha;
            } catch {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: persist typecheck diagnostic [skip ci]',
              content: content.toString('base64'),
              branch: context.payload.pull_request.head.ref,
              ...(sha ? { sha } : {})
            });
      - run: test "${{ steps.tc.outputs.exit }}" = "0"
