name: Diagnose Typecheck
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - id: tc
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee .github/typecheck-diagnostic.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> .github/typecheck-diagnostic.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/typecheck-diagnostic.txt
          git commit -m "chore: persist typecheck diagnostic [skip ci]" || exit 0
          git push
      - run: test "${{ steps.tc.outputs.exit }}" = "0"
