name: Repair credit card OCR import

on:
  push:
    branches: [fix/credit-card-pdf-import-resilience]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/credit-card-pdf-import-resilience
          fetch-depth: 0
      - name: Patch OCR importer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/import/credit-card-pdf/text/route.ts')
          t = p.read_text()
          t = t.replace('const GEMINI_TIMEOUT_MS = 20_000;\n', 'const GEMINI_TIMEOUT_MS = 15_000;\nconst GEMINI_MAX_PARALLEL = 3;\n')
          old = '      const rows = await requestGemini(sanitized); const uniqueRows = Array.from(new Map(rows.map(row => [fingerprint(row), row])).values()); if (!uniqueRows.length) throw new Error("NO_VALID_ROWS");\n'
          new = '''      const chunks: string[] = [];\n      for (let start = 0; start < sanitized.length; start += MAX_TEXT_CHARS) chunks.push(sanitized.slice(start, start + MAX_TEXT_CHARS));\n      const geminiFailures: string[] = [];\n      const rows: CardRow[] = [];\n      for (let start = 0; start < chunks.length; start += GEMINI_MAX_PARALLEL) {\n        const batch = chunks.slice(start, start + GEMINI_MAX_PARALLEL);\n        const results = await Promise.allSettled(batch.map(chunk => requestGemini(chunk)));\n        results.forEach((result, index) => {\n          if (result.status === "fulfilled") rows.push(...result.value);\n          else geminiFailures.push(result.reason instanceof Error ? result.reason.message : `GEMINI_CHUNK_${start + index + 1}_FAILED`);\n        });\n      }\n      const uniqueRows = Array.from(new Map(rows.map(row => [fingerprint(row), row])).values());\n      if (!uniqueRows.length) throw new Error(geminiFailures[0] || "NO_VALID_ROWS");\n      const partial = geminiFailures.length > 0;\n'''
          if old not in t: raise SystemExit('OCR Gemini block not found')
          t = t.replace(old, new)
          old = '      await prisma.importJob.update({ where: { id: job.id }, data: { status: "COMPLETED", rowsDetected: uniqueRows.length, rowsAnalyzed: uniqueRows.length, rowsImported: createdRows, rowsUpdated: updatedRows, rowsSkipped: Math.max(0, rows.length - uniqueRows.length), categoriesCreated: createdCategories, completedAt: new Date() } });\n      return NextResponse.json({ success: true, source: "CREDIT_CARD_OCR", rowsImported: createdRows, rowsUpdated: updatedRows, rowsSkipped: Math.max(0, rows.length - uniqueRows.length), identityMatched: identityMatchedRows, reprocessed: !!existing, privacy: "ocr-in-browser-sanitized-before-gemini" });\n'
          new = '''      const warnings = partial ? [`GEMINI_PARTIAL:${[...new Set(geminiFailures)].slice(0, 3).join(",")}`] : [];\n      await prisma.importJob.update({ where: { id: job.id }, data: { status: "COMPLETED", rowsDetected: uniqueRows.length, rowsAnalyzed: uniqueRows.length, rowsImported: createdRows, rowsUpdated: updatedRows, rowsSkipped: Math.max(0, rows.length - uniqueRows.length), categoriesCreated: createdCategories, errorMessage: warnings.length ? warnings.join("|") : null, completedAt: new Date() } });\n      return NextResponse.json({ success: true, partial, warnings, source: "CREDIT_CARD_OCR", rowsImported: createdRows, rowsUpdated: updatedRows, rowsSkipped: Math.max(0, rows.length - uniqueRows.length), identityMatched: identityMatchedRows, reprocessed: !!existing, privacy: "ocr-in-browser-sanitized-before-gemini" });\n'''
          if old not in t: raise SystemExit('OCR completion block not found')
          t = t.replace(old, new)
          p.write_text(t)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/import/credit-card-pdf/text/route.ts
          git commit -m 'fix: make credit card OCR import resilient to Gemini partial failures' || exit 0
          git push origin fix/credit-card-pdf-import-resilience
